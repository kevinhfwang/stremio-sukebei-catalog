name: Scrape Catalog (every 8h)

on:
  schedule:
    - cron: '0 */8 * * *'
  push:
    paths:
      - 'scripts/*.py'
      - 'data/config.json'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape RSS sources
        run: python scripts/scrape.py

      - name: Install libtorrent (BT 直抽封面)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-libtorrent

      - name: Fetch covers (JavDB / BitTorrent / Real-Debrid)
        env:
          RD_TOKEN: ${{ secrets.RD_TOKEN }}
          COVERS_PAT: ${{ secrets.COVERS_PAT }}
          COVERS_REPO: kevinhfwang/sukebei-covers
        run: /usr/bin/python3 scripts/fetch_covers.py

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "catalog: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
