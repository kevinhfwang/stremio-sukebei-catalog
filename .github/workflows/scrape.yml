name: Scrape Catalog (every 8h)

on:
  schedule:
    - cron: '0 */8 * * *'
  push:
    paths:
      - 'scripts/*.py'
      - 'data/config.json'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape RSS sources
        run: python scripts/scrape.py

      - name: Install libtorrent + ffmpeg (BT 直抽/视频抽帧)
        run: |
          # runner DNS 偶发瞬断（security.ubuntu.com resolve 失败）会让单次 apt 直接 exit 100，
          # 加重试循环兜底：清 lists + --fix-missing，3 次机会，最后校验二进制真的装上了
          for i in 1 2 3; do
            sudo apt-get clean
            sudo rm -rf /var/lib/apt/lists/*
            if sudo apt-get update -qq && sudo apt-get install -y -qq --fix-missing python3-libtorrent ffmpeg; then
              break
            fi
            echo "::warning::apt attempt $i failed, retrying in 30s..."
            sleep 30
          done
          dpkg -s python3-libtorrent >/dev/null
          ffmpeg -version >/dev/null

      - name: Fetch covers (JavDB / BitTorrent / Real-Debrid)
        env:
          RD_TOKEN: ${{ secrets.RD_TOKEN }}
          COVERS_PAT: ${{ secrets.COVERS_PAT }}
          COVERS_REPO: kevinhfwang/sukebei-covers
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: /usr/bin/python3 scripts/fetch_covers.py

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "catalog: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase
          git push
