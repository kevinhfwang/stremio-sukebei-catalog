name: Scrape Catalog (every 8h)

on:
  schedule:
    - cron: '0 */8 * * *'
  push:
    paths:
      - 'scripts/scrape.py'
      - 'data/config.json'
      - '.github/workflows/scrape.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Scrape RSS sources
        run: python scripts/scrape.py

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "catalog: update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
